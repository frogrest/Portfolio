<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141724"/>
      <stop offset="100%" stop-color="#07080d"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#f59e0b" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Squircle with Subtle Amber Accent Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="#f59e0b" stroke-width="1.75" stroke-opacity="0.45"/>

  <!-- Ambient Amber Glow behind letters -->
  <circle cx="32" cy="32" r="16" fill="#f59e0b" fill-opacity="0.1" filter="url(#softGlow)"/>

  <!-- Amber Status Beacon (Matching the ● GN navbar badge) -->
  <circle cx="16" cy="17" r="3.5" fill="url(#amberGrad)" filter="url(#softGlow)"/>

  <!-- Minimalist Monogram GN -->
  <!-- G in crisp optical white -->
  <path d="M29 27.5 C27.5 25.5 24.8 24 21.5 24 C16 24 12 28.5 12 34.5 C12 40.5 16 45 21.5 45 C26 45 29 42.5 29.8 38.5 H21 V34 H34 V39 C32.5 45 27.5 49 21.5 49 C13.5 49 7.5 42.5 7.5 34.5 C7.5 26.5 13.5 20 21.5 20 C26.2 20 30.2 22.5 32.5 26 Z" fill="#ffffff"/>

  <!-- N in vibrant amber gradient -->
  <path d="M38 21 H43.2 L52 35.8 V21 H56.5 V48 H51.3 L42.5 33.2 V48 H38 Z" fill="url(#amberGrad)"/>
</svg>